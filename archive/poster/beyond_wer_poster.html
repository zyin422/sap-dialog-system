  <title>Beyond WER Poster</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading Beyond WER Poster...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

t:5px solid #13294B;padding:7px 12px;text-align:center}.dg .b>b{display:block;color:#B93A1C;font-size:15px;letter-spacing:.06em;text-transform:uppercase}.dg .a{text-align:center;color:#E84A27;font-size:16px;line-height:1}.dg .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}.dg .row div{background:#fff;border:2px solid #13294B;border-radius:4px;padding:5px 6px;font-size:17px}.dg .row .o{border-style:dashed}.dg code{font-family:ui-monospace,Menlo,monospace;font-size:17px}\n.eqs{flex:1;display:flex;flex-direction:column;justify-content:space-around}.eq{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-bottom:1px solid #DDD8CC;font-family:'Source Serif 4',serif;font-size:27px}.eq:last-child{border-bottom:0}.eq .en{font-family:'Source Sans 3',sans-serif;font-size:18px;color:#3F4F69}.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;font-size:24px}.fr span:first-child{border-bottom:2px solid #13294B;padding:0 6px 2px}.fr span:last-child{padding-top:2px}\n</style>\n</helmet>\n<div class=\"p\" data-canvas-width=\"1920\" data-canvas-height=\"1440\" data-document-role=\"page\" data-label=\"Poster 48\u00d736 in (landscape)\">\n<div class=\"h\">\n<h1>Beyond WER: Quantifying ASR Error Propagation in Spoken Language Understanding for Dysarthric Speech</h1>\n<p><b>Zixuan Yin (Presenter)\u00b9</b>, Xiuwen Zheng\u00b9, Haolong Zheng\u00b9, Kush Bhardwaj\u00b9, Mark Hasegawa-Johnson\u00b9</p>\n<p>\u00b9 University of Illinois Urbana-Champaign \u00b7 Speech Accessibility Project, Statistical Speech Technology Lab</p>\n</div>\n<div class=\"cols\">\n<div class=\"c\">\n<div class=\"s\"><h2>1. Introduction</h2>\n<ul>\n<li>Dysarthria pushes commercial ASR WER from 3.2% to <b>36.3%</b></li>\n\n<li>One wrong phoneme changes the meaning: \u201ccall Kathy\u201d \u2192 \u201ccall Cassie\u201d, \u201cturn on\u201d \u2192 \u201cturn off\u201d, \u201c5mg\u201d \u2192 \u201c50mg\u201d.</li><li>Errors in ASR-sensitive slots may propagate to LLM tool execution</li>\n</ul></div>\n<div class=\"q\">What does fine-tuning a streaming ASR on dysarthric speech buy us in a downstream assistant, measured by task completion instead of WER?</div>\n<div class=\"s\"><h2>2. Pipeline architecture</h2>\n<svg sc-camel-view-box=\"0 -10 540 515\" role=\"img\" aria-label=\"Pipeline: dysarthric speech through streaming ASR (base or fine-tuned) or oracle text into a frozen LLM agent, producing a tool call and spoken reply that are scored by TS, TCS, PF and frame accuracy\" style=\"width:100%;height:auto;display:block;margin:auto 0\"><defs><marker id=\"ah\" sc-camel-marker-width=\"9\" sc-camel-marker-height=\"9\" sc-camel-ref-x=\"7\" sc-camel-ref-y=\"4.5\" orient=\"auto\"><path d=\"M0 0L9 4.5L0 9z\" fill=\"#13294B\"></path></marker></defs><rect x=\"30\" y=\"2\" width=\"310\" height=\"50\" rx=\"6\" fill=\"#fff\" stroke=\"#13294B\" stroke-width=\"2\"></rect><text x=\"185\" y=\"25\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#13294B\" text-anchor=\"middle\">Dysarthric utterance</text><text x=\"185\" y=\"44\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"15\" font-weight=\"400\" fill=\"#3F4F69\" text-anchor=\"middle\">SAP corpus \u00b7 push-to-talk turns</text><rect x=\"362\" y=\"2\" width=\"148\" height=\"50\" rx=\"6\" fill=\"#fff\" stroke=\"#13294B\" stroke-width=\"2\" stroke-dasharray=\"6 4\"></rect><text x=\"436\" y=\"25\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"16\" font-weight=\"700\" fill=\"#13294B\" text-anchor=\"middle\">Reference text</text><text x=\"436\" y=\"44\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"14\" font-weight=\"400\" fill=\"#3F4F69\" text-anchor=\"middle\">oracle, 0% WER</text><circle cx=\"364\" cy=\"4\" r=\"11\" fill=\"#E84A27\"></circle><text x=\"364\" y=\"9\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">1</text><line x1=\"185\" y1=\"52\" x2=\"185\" y2=\"78\" stroke=\"#13294B\" stroke-width=\"2.5\" marker-end=\"url(#ah)\"></line><rect x=\"30\" y=\"80\" width=\"310\" height=\"102\" rx=\"6\" fill=\"#E6ECF5\" stroke=\"#13294B\" stroke-width=\"2\"></rect><text x=\"185\" y=\"101\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"15.5\" font-weight=\"700\" fill=\"#13294B\" text-anchor=\"middle\">Streaming ASR \u00b7 Parakeet-TDT 0.6B</text><rect x=\"42\" y=\"112\" width=\"138\" height=\"60\" rx=\"6\" fill=\"#fff\" stroke=\"#13294B\" stroke-width=\"2\"></rect><text x=\"111\" y=\"135\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"17\" font-weight=\"700\" fill=\"#13294B\" text-anchor=\"middle\">Base</text><text x=\"111\" y=\"156\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"15\" font-weight=\"400\" fill=\"#3F4F69\" text-anchor=\"middle\">28.15% WER</text><rect x=\"190\" y=\"112\" width=\"138\" height=\"60\" rx=\"6\" fill=\"#fff\" stroke=\"#E84A27\" stroke-width=\"2.5\"></rect><text x=\"259\" y=\"135\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"17\" font-weight=\"700\" fill=\"#13294B\" text-anchor=\"middle\">Fine-tuned</text><text x=\"259\" y=\"156\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"15\" font-weight=\"400\" fill=\"#3F4F69\" text-anchor=\"middle\">10.70% WER</text><circle cx=\"44\" cy=\"114\" r=\"11\" fill=\"#E84A27\"></circle><text x=\"44\" y=\"119\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">2</text><circle cx=\"192\" cy=\"114\" r=\"11\" fill=\"#E84A27\"></circle><text x=\"192\" y=\"119\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">3</text><line x1=\"185\" y1=\"182\" x2=\"185\" y2=\"208\" stroke=\"#13294B\" stroke-width=\"2.5\" marker-end=\"url(#ah)\"></line><rect x=\"30\" y=\"210\" width=\"310\" height=\"46\" rx=\"6\" fill=\"#fff\" stroke=\"#13294B\" stroke-width=\"2\"></rect><text x=\"185\" y=\"229\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"15\" font-weight=\"400\" fill=\"#13294B\" text-anchor=\"middle\">\u201cturn of closet lite\u201d  (base)</text><text x=\"185\" y=\"248\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"15\" font-weight=\"400\" fill=\"#13294B\" text-anchor=\"middle\">\u201cturn off closet light\u201d  (fine-tuned)</text><line x1=\"185\" y1=\"256\" x2=\"185\" y2=\"282\" stroke=\"#13294B\" stroke-width=\"2.5\" marker-end=\"url(#ah)\"></line><rect x=\"30\" y=\"284\" width=\"310\" height=\"64\" rx=\"6\" fill=\"#13294B\" stroke=\"#13294B\" stroke-width=\"2\"></rect><text x=\"185\" y=\"308\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"18\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">Frozen LLM agent \u00b7 Qwen3-8B</text><text x=\"185\" y=\"331\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"15\" font-weight=\"400\" fill=\"#DCE3F0\" text-anchor=\"middle\">greedy (T = 0) \u00b7 29-tool OpenAPI catalog</text><path d=\"M510 27H530V316H342\" fill=\"none\" stroke=\"#13294B\" stroke-width=\"2.5\" stroke-dasharray=\"6 4\" marker-end=\"url(#ah)\"></path><line x1=\"185\" y1=\"348\" x2=\"185\" y2=\"374\" stroke=\"#13294B\" stroke-width=\"2.5\" marker-end=\"url(#ah)\"></line><rect x=\"30\" y=\"376\" width=\"310\" height=\"64\" rx=\"6\" fill=\"#fff\" stroke=\"#13294B\" stroke-width=\"2\"></rect><text x=\"185\" y=\"394\" font-family=\"ui-monospace,Menlo,monospace\" font-size=\"15\" font-weight=\"700\" fill=\"#13294B\" text-anchor=\"middle\">iot_device_power</text><text x=\"185\" y=\"411\" font-family=\"ui-monospace,Menlo,monospace\" font-size=\"13.5\" fill=\"#13294B\" text-anchor=\"middle\">{device: closet light, state: off}</text><text x=\"185\" y=\"431\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"15\" font-weight=\"400\" fill=\"#3F4F69\" text-anchor=\"middle\" font-style=\"italic\">\u201cGot it, turning off the closet light.\u201d</text><line x1=\"185\" y1=\"440\" x2=\"185\" y2=\"462\" stroke=\"#13294B\" stroke-width=\"2.5\" marker-end=\"url(#ah)\"></line><rect x=\"30\" y=\"464\" width=\"310\" height=\"36\" rx=\"6\" fill=\"#FCE3DA\" stroke=\"#E84A27\" stroke-width=\"2\"></rect><text x=\"185\" y=\"488\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"17\" font-weight=\"700\" fill=\"#13294B\" text-anchor=\"middle\">TS \u00b7 TCS \u00b7 PF \u00b7 Frame accuracy</text><text x=\"362\" y=\"92\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"16\" font-weight=\"700\" fill=\"#B93A1C\" text-anchor=\"start\">Conditions</text><circle cx=\"373\" cy=\"113\" r=\"11\" fill=\"#E84A27\"></circle><text x=\"373\" y=\"118\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">1</text><text x=\"392\" y=\"118\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"16\" font-weight=\"400\" fill=\"#13294B\" text-anchor=\"start\">Oracle text</text><circle cx=\"373\" cy=\"141\" r=\"11\" fill=\"#E84A27\"></circle><text x=\"373\" y=\"146\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">2</text><text x=\"392\" y=\"146\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"16\" font-weight=\"400\" fill=\"#13294B\" text-anchor=\"start\">Base ASR</text><circle cx=\"373\" cy=\"169\" r=\"11\" fill=\"#E84A27\"></circle><text x=\"373\" y=\"174\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">3</text><text x=\"392\" y=\"174\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"16\" font-weight=\"400\" fill=\"#13294B\" text-anchor=\"start\">Fine-tuned ASR</text><text x=\"362\" y=\"222\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"14.5\" font-weight=\"400\" fill=\"#3F4F69\" text-anchor=\"start\">Same frozen LLM,</text><text x=\"362\" y=\"242\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"14.5\" font-weight=\"400\" fill=\"#3F4F69\" text-anchor=\"start\">prompt and tool</text><text x=\"362\" y=\"262\" font-family=\"'Source Sans 3',sans-serif\" font-size=\"14.5\" font-weight=\"400\" fill=\"#3F4F69\" text-anchor=\"start\">schema in all three</text></svg>\n</div>\n</div>\n<div class=\"c\">\n<div class=\"s\" style=\"flex: none; padding: 10px 18px;\"><h2>3. SAP Schema: 29 tools, 10 domains</h2>\n<p style=\"margin:0 0 4px;font-size:18px\">Derived from Amazon MASSIVE (60 intents, 18 scenarios, 55 slot types).</p>\n<ol class=\"stp\" style=\"font-size:17.5px; padding-left: 20px; margin: 0 0 3px;\">\n<li style=\"margin: 1px 0;\">Filter MASSIVE intents and slots to daily assistive needs.</li>\n<li style=\"margin: 1px 0;\">Construct 10 domains and 29 tools based on dataset</li>\n<li style=\"margin: 1px 0;\">Iterate after human annotations and LLM label pilot</li>\n</ol>\n<div style=\"margin-top:4px;display:flex;flex-direction:column;gap:2px;\">\n<div class=\"dm\"><span class=\"d\">Accessibility</span><span class=\"t\">accessibility_dictation_toggle \u00b7 accessibility_ui_scale</span></div>\n<div class=\"dm\"><span class=\"d\">Calendar</span><span class=\"t\">alarm_manage \u00b7 schedule_manage</span></div>\n<div class=\"dm\"><span class=\"d\">Communication</span><span class=\"t\">call_make \u00b7 call_manage \u00b7 messages_manage \u00b7 email_manage</span></div>\n<div class=\"dm\"><span class=\"d\">General QA</span><span class=\"t\">qa_search \u00b7 weather_query \u00b7 device_find \u00b7 order_manage</span></div>\n<div class=\"dm\"><span class=\"d\">Health</span><span class=\"t\">health_medication_reminder \u00b7 health_refill_query \u00b7 health_info_query</span></div>\n<div class=\"dm\"><span class=\"d\">Maps &amp; Places</span><span class=\"t\">maps_route \u00b7 places_search \u00b7 reservations_manage</span></div>\n<div class=\"dm\"><span class=\"d\">Media</span><span class=\"t\">media_play \u00b7 media_search \u00b7 media_control \u00b7 media_volume</span></div>\n<div class=\"dm\"><span class=\"d\">Notes &amp; Memory</span><span class=\"t\">lists_manage \u00b7 memory_note_manage</span></div>\n<div class=\"dm\"><span class=\"d\">Smart Home</span><span class=\"t\">iot_device_power \u00b7 iot_device_adjust \u00b7 iot_sensor_query</span></div>\n<div class=\"dm\"><span class=\"d\">Transport</span><span class=\"t\">rideshare_book \u00b7 transit_lookup</span></div>\n</div></div>\n<div class=\"s\" style=\"flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 12px 18px;\">\n<h2 style=\"margin: 0 0 6px;\">4. Metrics</h2>\n\n<div class=\"nt\" style=\"flex: 1; display: flex; flex-direction: column; justify-content: space-between;\">\n  <div>\n    <div style=\"display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2px;\">\n      <h3 style=\"font-size: 23px; margin: 0; color: #13294B;\">Word Error Rate (WER)</h3>\n      <span style=\"font-size: 13.5px; font-weight: 700; color: #3F4F69; text-transform: uppercase; letter-spacing: 0.05em;\">Acoustic Baseline</span>\n    </div>\n    <div style=\"padding: 2px 0;\">\n      <img src=\"wer.svg\" alt=\"WER = (S + D + I) / N\" height=\"32\" style=\"display: block;\">\n    </div>\n    <div style=\"font-size: 17px; line-height: 1.25; color: #3F4F69; margin-top: 2px;\">\n      <b style=\"color: #13294B;\">Acoustic Token Distance:</b> Levenshtein edit operations\u2014Substitutions (<i>S</i>), Deletions (<i>D</i>), and Insertions (<i>I</i>)\u2014over gold tokens (<i>N</i>).\n    </div>\n  </div>\n  <div style=\"background: #F4F1EA; border-left: 5px solid #13294B; padding: 5px 10px; margin-top: 4px; font-size: 16px; line-height: 1.25; color: #13294B;\">\n    <b>Acoustic Blind Spot:</b> Weights all token errors identically. Benign dysarthric hesitations or vocal tremors sharply inflate WER without impairing intent. Conversely, a single corrupted phoneme in a critical slot (<i>\u201c5mg\u201d</i> \u2192 <i>\u201c50mg\u201d</i>) has low WER penalty but fatal downstream impact.\n  </div>\n</div>\n\n<div class=\"nt\" style=\"flex: 1; display: flex; flex-direction: column; justify-content: space-between; border-top: 1px solid #DDD8CC; padding-top: 8px; margin-top: 6px;\">\n  <div>\n    <div style=\"display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2px;\">\n      <h3 style=\"font-size: 23px; margin: 0; color: #13294B;\">Parameter Filling (PF)</h3>\n      <span style=\"font-size: 13.5px; font-weight: 700; color: #E84A27; text-transform: uppercase; letter-spacing: 0.05em;\">Downstream SLU Metric</span>\n    </div>\n    <div style=\"padding: 2px 0;\">\n      <img src=\"pf.svg\" alt=\"PF = # correct gold slots / # gold slots\" height=\"36\" style=\"display: block;\">\n    </div>\n    <div style=\"font-size: 17px; line-height: 1.25; color: #3F4F69; margin-top: 2px;\">\n      <b style=\"color: #13294B;\">Semantic Parameter Grounding:</b> Exact-match ratio of extracted slot values against canonical gold OpenAPI tool arguments.\n    </div>\n  </div>\n  <div style=\"background: #FCE3DA; border-left: 5px solid #E84A27; padding: 5px 10px; margin-top: 4px; font-size: 16px; line-height: 1.25; color: #13294B;\">\n    <b>The Primary Bottleneck:</b> Intent routing is resilient (74.55%), but Base ASR degrades PF by <b>42.19%</b> (88.41% \u2192 46.22%). Fine-tuning recovers <b>+29.51% PF</b>, driving our <b>62.67% Adaptation Recovery Rate</b>.\n  </div>\n</div>\n\n<div style=\"background: #F4F1EA; border-radius: 4px; padding: 5px 10px; font-size: 15px; line-height: 1.25; color: #3F4F69; margin-top: 6px;\">\n  <b style=\"color: #13294B;\">Command Frame Accuracy:</b> End-to-end task completion requires both correct Tool Selection (<span style=\"color: #13294B; font-weight: 600;\">TS = 1</span>) and 100% Parameter Filling (<span style=\"color: #13294B; font-weight: 600;\">PF = 1</span>).\n</div>\n\n</div>\n</div>\n<div class=\"c\">\n<div class=\"s\" style=\"flex:none\"><h2>5. SAP evaluation corpus</h2>\n<div class=\"k\"><div><b>124</b>speakers</div><div><b>34,577</b>recordings</div><div><b>1,108</b>benchmark clips</div></div>\n</div>\n<div class=\"s\"><h2>6. Results (N = 1,108)</h2>\n<sc-raw-table>\n<sc-raw-tr><sc-raw-th>Condition</sc-raw-th><sc-raw-th>WER</sc-raw-th><sc-raw-th>Tool sel.</sc-raw-th><sc-raw-th>Param fill.</sc-raw-th><sc-raw-th>Frame acc.</sc-raw-th></sc-raw-tr>\n<sc-raw-tr><sc-raw-td>Oracle</sc-raw-td><sc-raw-td>0.00%</sc-raw-td><sc-raw-td>95.67%</sc-raw-td><sc-raw-td>88.41%</sc-raw-td><sc-raw-td>84.03%</sc-raw-td></sc-raw-tr>\n<sc-raw-tr><sc-raw-td>Base ASR</sc-raw-td><sc-raw-td>28.15%</sc-raw-td><sc-raw-td>74.55%</sc-raw-td><sc-raw-td>46.22%</sc-raw-td><sc-raw-td class=\"hl\">38.09%</sc-raw-td></sc-raw-tr>\n<sc-raw-tr><sc-raw-td>Fine-tuned</sc-raw-td><sc-raw-td>10.70%</sc-raw-td><sc-raw-td>92.96%</sc-raw-td><sc-raw-td>75.73%</sc-raw-td><sc-raw-td class=\"hl\">66.88%</sc-raw-td></sc-raw-tr>\n<sc-raw-tr class=\"g\"><sc-raw-td>Gain</sc-raw-td><sc-raw-td class=\"g\">\u221217.45</sc-raw-td><sc-raw-td class=\"g\">+18.41</sc-raw-td><sc-raw-td class=\"g\">+29.51</sc-raw-td><sc-raw-td class=\"g\">+28.79</sc-raw-td></sc-raw-tr>\n</sc-raw-table>\n<div class=\"arr\" style=\"margin-top:12px\"><div class=\"big\">62.67%</div><div><b>Adaptation Recovery Rate</b><br>(66.88 \u2212 38.09) / (84.03 \u2212 38.09) of the gap recovered</div></div>\n</div>\n<div class=\"s\" style=\"flex:1;display:flex;flex-direction:column\"><h2>7. Next steps</h2>\n<div class=\"nt\"><h3>Conversational replies</h3><div>The assistant speaks back what it understood (\u201cGot it, turning off the closet light\u201d).</div></div>\n<div class=\"nt\"><h3>Evaluating multi-turn tasks</h3><div class=\"pr\"><div><b>Elaboration</b>Multi-slot commands split into sub-phrases.&nbsp;<br>Focus on cumulative dialogue tracking.<i>\u201cReschedule my meeting with Fred Placid (SLICE) at 11:30, September 18th\u201d</i></div><div><b>Repair</b>High-severity speakers or low ASR confidence. <br>Focus on proactive error correction.<i>\u201cRemind me to take a break in 30 minutes\u201d</i></div></div></div>\n</div>\n</div>\n</div>\n\n</div>\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1440}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn {};\n}\n}\n<\/script>\n\n\n</body></html>"
